
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar música - Minhas Músicas</title>
    <link rel="stylesheet" href="cadastrar.css">
</head>
<body>
    <main class="container">
        <a class="voltar" href="index.html">Voltar para a lista</a>

        <h1>Cadastrar música</h1>

        <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo">
        </div>

        <div class="campo">
            <label for="artista">Artista</label>
            <input type="text" id="artista">
        </div>

        <div class="campo">
            <label for="genero">Gênero</label>
            <input type="text" id="genero">
        </div>

        <div class="campo">
            <label for="ano">Ano</label>
            <input type="number" id="ano">
        </div>

        <div class="campo">
            <label for="duracao">Duração em minutos</label>
            <input type="number" id="duracao">
        </div>

        <button id="botaoCadastrar">Cadastrar</button>
    </main>

    <script src="cadastrar.js"></script>
</body>
</html>
